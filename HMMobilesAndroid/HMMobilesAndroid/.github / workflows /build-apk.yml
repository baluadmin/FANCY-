name: Build Bavesh Fancy & Stationery APK

on:
  workflow_dispatch:
  push:
    paths:
      - "HMMobilesAndroid/HMMobilesAndroid/**"

jobs:
  build:
    name: Build Bavesh Fancy & Stationery APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HMMobilesAndroid/HMMobilesAndroid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        run: gradle --version

      - name: Clean project
        run: gradle clean --no-daemon

      - name: Build Bavesh Fancy & Stationery APK
        run: gradle assembleDebug --no-daemon

      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Bavesh Fancy & Stationery APK
        uses: actions/upload-artifact@v4
        with:
          name: Bavesh-Fancy-Stationery-APK
          path: HMMobilesAndroid/HMMobilesAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
